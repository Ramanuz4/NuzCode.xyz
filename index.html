<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Ramanuz Kashyap — game developer and designer."
    />
    <title>NuzCode — Ramanuz Kashyap</title>
    <link rel="icon" href="assets/images/logos/Logo White BG NO BG.png" />
    <link rel="stylesheet" href="css/site.css" />
    <script src="js/site.js" defer></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </head>
  <body>
    <header class="topline">
      <a href="index.html">Ramanuz Kashyap</a
      ><span class="top-role">Game Developer & Designer</span>
      <div class="top-right"></div>
    </header>
    <main class="home">
      <h1 class="hero-name">Ramanuz Kashyap</h1>
      <div class="tile-grid">
        <a class="tile about-tile" href="pages/about.html"
          ><span class="tile-label">About</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile portfolio-tile" href="pages/portfolio.html"
          ><span class="tile-label">Portfolio</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile contact-tile" href="pages/contact.html"
          ><span class="tile-label">Contact</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span
        ></a>
        <div
          class="tile portrait-tile"
          aria-label="Ramanuz Kashyap profile picture"
        >
          <img src="assets/images/profile/pfp 2.jpg" alt="Ramanuz Kashyap" />
        </div>
        <a class="tile tools-tile" href="pages/skills.html"
          ><div class="tool-icons">
            <span class="tool-icon ue"
              ><ion-icon
                name="game-controller-outline"
                aria-hidden="true"
              ></ion-icon></span
            ><span class="tool-icon unity"
              ><ion-icon
                name="diamond-outline"
                aria-hidden="true"
              ></ion-icon></span
            ><span class="tool-icon code"
              ><ion-icon
                name="code-slash-outline"
                aria-hidden="true"
              ></ion-icon></span
            ><span class="tool-icon pixel"
              ><ion-icon name="grid-outline" aria-hidden="true"></ion-icon
            ></span>
          </div>
          <span class="tile-label">Tools & Skills</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span></a
        ><a class="tile resume-tile" href="pages/resume.html"
          ><span class="tile-label">Resume</span
          ><span class="arrow"
            ><ion-icon
              name="arrow-forward-outline"
              aria-hidden="true"
            ></ion-icon></span
        ></a>
      </div>
      <p class="home-note">CRAFTING IMMERSIVE & MODERN EXPERIENCES · NUZCODE</p>
    </main>
    <footer class="footer">
      <span>NUZCODE · PERSONAL PORTFOLIO</span
      ><span>© <span id="year">2026</span> RAMANUZ KASHYAP</span
      ><a href="https://github.com/Ramanuz4" target="_blank" rel="noreferrer"
        >GITHUB
        <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon
      ></a>
    </footer>
  </body>
</html>
